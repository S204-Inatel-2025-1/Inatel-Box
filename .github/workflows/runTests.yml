name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install backend dependencies
        run: |
          cd backend
          npm install

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Install test dependencies
        run: |
          cd tests
          npm install cypress jest supertest
        
      - name: Install K6
        run: |
          cd tests

          sudo apt-get remove -y k6
          sudo rm -f /etc/apt/sources.list.d/grafana.list

          sudo apt-get update
          sudo apt-get install -y ca-certificates gnupg2

          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://grafana.com/api/gpg.key | sudo gpg --dearmor -o /etc/apt/keyrings/grafana.gpg
          echo "deb [signed-by=/etc/apt/keyrings/grafana.gpg] https://apt.grafana.com stable main" | sudo tee -a /etc/apt/sources.list.d/grafana.list
          
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Start backend
        run: |
          cd backend
          npm start &
        env:
          CI: true

      - name: Start frontend
        run: |
          cd frontend
          npm start &
        env:
          CI: true

      - name: Wait for services
        run: sleep 15

      - name: Run Cypress tests
        run: |
          cd tests
          npx cypress run
      
      - name: Run Jest backend tests
        run: |
          cd tests
          npm test

      - name: Run K6 tests
        run: |
          cd tests/load
          k6 run load-tests.js